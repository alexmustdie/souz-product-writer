[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "souz-product-writer"
version = "0.1.0"
description = "Grounded B2B product drafts with DeepSeek"
requires-python = ">=3.11"
dependencies = ["openai>=1.68,<4", "pydantic>=2.10,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
product-writer = "product_writer.cli:main"

[tool.setuptools.packages.find]
include = ["product_writer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
